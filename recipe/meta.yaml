{% set name = "xnvme" %}
{% set libname = "libxnvme" %}
{% set version = "0.8.1" %}

package:
  name: {{ libname|lower }}
  version: {{ version }}

source:
  url: https://github.com/{{ name }}/{{ name }}/releases/download/v{{ version }}/{{ name }}-{{ version }}.tar.gz
  sha256: "fc06ce2214bdd6143b4611b5923a9780bc4fe799b52e4a3c1c8cf594bff4dcee"

build:
  skip: true  # [not linux]
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - meson
    - ninja
    - pkgconf

  host:
    - libaio  # [linux]
    - liburing  # [linux]

test:
  requires:
    - pkgconf

about:
  home: https://xnvme.io/
  summary: Tools and libraries for efficient I/O
  license: BSD-3-Clause
  license_family: BSD
  license_file:
    - LICENSE
    - subprojects/upcie/LICENSE
    - subprojects/ufuse/LICENSE
  doc_url: https://xnvme.io/
  dev_url: https://github.com/xnvme/xnvme

extra:
  recipe-maintainers:
    - safl
