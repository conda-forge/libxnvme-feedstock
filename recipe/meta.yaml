{% set name = "xnvme" %}
{% set libname = "libxnvme" %}
{% set version = "0.8.0" %}

package:
  name: {{ libname|lower }}
  version: {{ version }}

source:
  url: https://github.com/{{ name }}/{{ name }}/releases/download/v{{ version }}/{{ name }}-{{ version }}.tar.gz
  sha256: "0a2b7aefd043231ee73eb5754c59ac8e4e0d048cf4386814d382ff46b75cb964"

build:
  skip: true  # [not linux]
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - meson
    - ninja
    - pkgconf

  host:
    - libaio  # [linux]
    - liburing  # [linux]

test:
  requires:
    - pkgconf

about:
  home: https://xnvme.io/
  summary: Tools and libraries for efficient I/O
  license: BSD-3-Clause
  license_family: BSD
  license_file:
    - LICENSE
  doc_url: https://xnvme.io/
  dev_url: https://github.com/xnvme/xnvme

extra:
  recipe-maintainers:
    - safl
